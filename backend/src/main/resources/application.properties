# ==============================================================================
# Spring Boot Configuration for Eli Rohith Sri Ganesh - Portfolio Backend
# ==============================================================================

spring.application.name=portfolio-backend
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# Database Configuration (MySQL)
# Default values point to local MySQL; overridden in production via environment variables
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Email Notification Configuration (Spring Mail)
# Uses standard SMTP (e.g. Gmail SMTP or free SMTP service)
# ------------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------------------------
# Portfolio Custom Application Settings
# ------------------------------------------------------------------------------
portfolio.mail.recipient=${PORTFOLIO_MAIL_RECIPIENT:rohitheli4444@gmail.com}
portfolio.cors.allowed-origins=${PORTFOLIO_CORS_ALLOWED_ORIGINS:*}
