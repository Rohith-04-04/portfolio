# ==============================================================================
# Spring Boot Configuration for Eli Rohith Sri Ganesh - Portfolio Backend
# ==============================================================================

spring.application.name=portfolio-backend
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# Database Configuration
# Defaults to embedded H2 database (with MySQL compatibility) so it starts instantly
# on any cloud container (Render, Docker, Local) without crashing.
# If SPRING_DATASOURCE_URL is provided in environment variables, it uses that instead.
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Disable auto-running schema.sql scripts on startup (Hibernate automatically manages table creation)
spring.sql.init.mode=never


# ------------------------------------------------------------------------------
# Email Notification Configuration (Spring Mail)
# Uses standard SMTP (e.g. Gmail SMTP or free SMTP service)
# ------------------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# ------------------------------------------------------------------------------
# Portfolio Custom Application Settings
# ------------------------------------------------------------------------------
portfolio.mail.recipient=${PORTFOLIO_MAIL_RECIPIENT:rohitheli4444@gmail.com}
portfolio.cors.allowed-origins=${PORTFOLIO_CORS_ALLOWED_ORIGINS:*}
