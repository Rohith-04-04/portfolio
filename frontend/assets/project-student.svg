<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="smsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="8" fill="url(#smsGrad)"/>
  
  <!-- Header -->
  <rect width="600" height="36" rx="8" fill="#334155"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  <text x="300" y="23" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Student Management System — Spring Boot N-Tier Architecture</text>

  <!-- Left Side: Architecture Diagram -->
  <rect x="25" y="55" width="265" height="185" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="40" y="80" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">N-Tier System Architecture</text>
  
  <rect x="40" y="95" width="235" height="28" rx="4" fill="#3b82f6"/>
  <text x="157" y="114" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Controller Layer (REST Endpoints)</text>

  <rect x="40" y="132" width="235" height="28" rx="4" fill="#6366f1"/>
  <text x="157" y="151" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Service Layer (Business Logic)</text>

  <rect x="40" y="169" width="235" height="28" rx="4" fill="#059669"/>
  <text x="157" y="188" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Repository Layer (Spring Data JPA)</text>

  <rect x="40" y="206" width="235" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="157" y="221" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">MySQL Relational Database</text>

  <!-- Right Side: API Documentation Postman -->
  <rect x="310" y="55" width="265" height="185" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="325" y="80" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Postman API Contract</text>

  <rect x="325" y="95" width="235" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="335" y="115" font-family="monospace" font-size="11" fill="#10b981">GET /api/v1/students</text>

  <rect x="325" y="135" width="235" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="335" y="155" font-family="monospace" font-size="11" fill="#38bdf8">POST /api/v1/students/register</text>

  <rect x="325" y="175" width="235" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="335" y="195" font-family="monospace" font-size="11" fill="#f59e0b">PUT /api/v1/students/{id}</text>

  <!-- Footer Banner -->
  <rect x="25" y="255" width="550" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="40" y="280" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Java Full Stack Internship Project — EduSkills Foundation</text>
  <text x="40" y="302" font-family="monospace" font-size="11" fill="#94a3b8">Features: NIC Validation, Student Records CRUD, Course Mapping</text>
  <text x="40" y="322" font-family="monospace" font-size="11" fill="#10b981">✓ Documented with Postman Collection &amp; GitHub Repository</text>
</svg>
